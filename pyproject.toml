[project]
name = "financial-model"
dynamic = ["version"]
description = "A financial model for personal and family financial planning"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Andrew Hunt", email = "andrewcolinhunt@gmail.com"}]
dependencies = []  # All dependencies managed by Pixi

# Build settings ----------------------------------------------------------------------
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/financial_model/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_model"]

# =============================================================================
# PIXI — single env, all tooling in one solve
# =============================================================================
[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
requires-pixi = "==0.66.0"

[tool.pixi.dependencies]
python       = "3.12.*"
# Dev tooling
pytest       = "*"
pytest-xdist = "*"
ruff         = "==0.13.2"
pre-commit   = "=4.3.0,<5"
mypy         = "==1.18.2"
ipython      = "*"
ipykernel    = "*"
# Docs (Jupyter Book 2 needs Node 20+)
nodejs       = ">=20"

[tool.pixi.pypi-dependencies]
financial-model = { path = ".", editable = true }
# Small runtime kit
rootutils = ">=1.0"
rich      = "*"
beartype  = "*"
pydantic  = "*"
# Docs
jupyter-book = ">=2.0.0"
mystmd       = ">=1.3.0"

[tool.pixi.tasks]
setup            = "bash scripts/setup.sh"
test             = "pytest"
test-unit        = "pytest -m 'not integration'"
test-integration = "pytest -m integration -n 4"
fmt              = "ruff format . && ruff check --fix ."
docs-build       = { cmd = "jupyter-book build --html", cwd = "docs" }
docs-serve       = { cmd = "python -m http.server -d _build/html 8000", cwd = "docs" }
docs-clean       = { cmd = "jupyter-book clean", cwd = "docs" }

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================
[tool.pytest.ini_options]
minversion     = "7"
testpaths      = ["tests"]
pythonpath     = ["tests"]
log_cli_level  = "INFO"
xfail_strict   = true
addopts        = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "integration: needs real infra — run with '-m integration'",
]

[tool.mypy]
mypy_path             = "src"
files                 = ["src/financial_model", "tests"]
exclude               = "^_dev/"
python_version        = "3.12"
warn_return_any       = true
warn_unused_configs   = true
strict                = true
enable_error_code     = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable      = true
explicit_package_bases = true
namespace_packages    = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
ignore_errors = true

[tool.ruff]
extend-exclude = ["_dev", ".pixi"]

[tool.ruff.lint]
extend-select = [
    "ARG",      # flake8-unused-arguments
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "EM",       # flake8-errmsg
    "EXE",      # flake8-executable
    "G",        # flake8-logging-format
    "I",        # isort
    "ICN",      # flake8-import-conventions
    "PGH",      # pygrep-hooks
    "PIE",      # flake8-pie
    "PL",       # pylint
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "RUF",      # Ruff-specific
    "SIM",      # flake8-simplify
    "T20",      # flake8-print
    "UP",       # pyupgrade
    "YTT",      # flake8-2020
]
ignore = [
    "PLC0415",  # Deferred imports are intentional
    "PLR09",    # Too many <...>
    "PLR2004",  # Magic value used in comparison
    "G004",     # logging-f-string
]
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["ARG001", "ARG002"]
"tests/**" = [
    "ARG",
    "E402",
    "PLW2901",
    "PT011",
    "PT012",
    "PT017",
    "PT019",
    "T20",
]

[tool.codespell]
skip = "pixi.lock,_dev/**"
