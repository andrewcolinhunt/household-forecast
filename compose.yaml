name: financial-model

services:
  db:
    image: postgres:17
    container_name: financial-model-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: financial_model
      POSTGRES_USER: financial_model_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - financial-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U financial_model_admin -d financial_model"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  financial-data:
    name: financial-model-postgres
