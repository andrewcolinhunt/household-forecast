name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PIXI_LOCKED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.66.0
          locked: true

      - name: Lint
        run: pixi run fmt

      - name: Check for lint changes
        run: git diff --exit-code

  pre-commit:
    runs-on: ubuntu-latest
    env:
      PIXI_LOCKED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.66.0
          locked: true

      - name: Run pre-commit
        run: pixi run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    env:
      PIXI_LOCKED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.66.0
          locked: true

      - name: Run tests
        run: pixi run test
