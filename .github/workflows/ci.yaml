name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PIXI_LOCKED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.66.0
          locked: true

      - name: Lint
        run: pixi run fmt

      - name: Check for lint changes
        run: git diff --exit-code

  pre-commit:
    runs-on: ubuntu-latest
    env:
      PIXI_LOCKED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.66.0
          locked: true

      - name: Run pre-commit
        run: pixi run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    env:
      PIXI_LOCKED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.66.0
          locked: true

      - name: Run tests
        run: pixi run test

      - name: Check public repository contents
        run: pixi run --locked python scripts/check_public_content.py

      - name: Check deployment environment
        run: pixi run --locked check-cloud

      - name: Check types
        run: pixi run --locked mypy

      - name: Build documentation
        run: pixi run --locked docs-build

  cloud-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test exported deployment environment
        run: |
          docker run --rm --user root \
            -v "$PWD:/workspace" -w /workspace \
            -e SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0 \
            mambaorg/micromamba:2.3.3@sha256:800e7ade3ffe29c9a9ac2026163131495f8197c3852e572c5835beb4e8a33cd6 bash -lc \
            'micromamba create -y -n verify -f environment.yml &&
             micromamba run -n verify python -m pip check &&
             micromamba run -n verify python -m pytest -m "not integration" -q'
